name: Unlock Pair Extraordinaire Gold (48 PRs)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pair-quest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Identity
        run: |
          git config user.name "rzikydn"
          git config user.email "w1ld4n.r.w1j4y4@gmail.com"

      - name: Execute 48 Co-Authored PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Otomatis mendeteksi branch default (master)
          BASE_BRANCH=$(git branch --show-current)
          echo "Base branch is: $BASE_BRANCH"
          
          for i in {1..48}; do
            BRANCH="pair-quest-run-$i"
            git checkout -B "$BRANCH"
            echo "Quest progress iteration $i of 48 - $(date)" >> quest.txt
            git add quest.txt
            
            # Commit dengan Co-authored-by
            git commit -m "feat: pair collaboration $i

          Co-authored-by: octocat <octocat@users.noreply.github.com>"
            
            git push -u origin "$BRANCH" --force
            
            # Buat PR ke branch default (master)
            PR_URL=$(gh pr create --title "Pair Quest #$i" --body "Coauthored commit for iteration $i" --base "$BASE_BRANCH" --head "$BRANCH")
            
            # Merge PR otomatis dan hapus branch
            gh pr merge "$PR_URL" --merge --delete-branch
            
            git checkout "$BASE_BRANCH"
            git pull origin "$BASE_BRANCH"
            echo "--- Selesai PR #$i ---"
            sleep 1
          done
